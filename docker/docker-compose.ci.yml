# CI override: joins the app container to the db-only network so it can reach
# healthcaresamples-db (started by make db-up) by hostname, while still
# exposing API ports to the host for C# integration tests and Playwright.
#
# The db service from docker-compose.yml is suppressed (scale: 0) because
# Postgres is already running via docker-compose.db.yml.
#
# Usage: docker compose -f docker/docker-compose.yml -f docker/docker-compose.ci.yml \
#          up -d --build --no-deps app dashboard
services:
  app:
    networks:
      - default
      - dbnet
    environment:
      ConnectionStrings__Postgres: Host=healthcaresamples-db;Database=gatekeeper;Username=postgres;Password=${DB_PASSWORD:-changeme}
      ConnectionStrings__Postgres_Clinical: Host=healthcaresamples-db;Database=clinical;Username=postgres;Password=${DB_PASSWORD:-changeme}
      ConnectionStrings__Postgres_Scheduling: Host=healthcaresamples-db;Database=scheduling;Username=postgres;Password=${DB_PASSWORD:-changeme}
      ConnectionStrings__Postgres_ICD10: Host=healthcaresamples-db;Database=icd10;Username=postgres;Password=${DB_PASSWORD:-changeme}
      CLINICAL_CONNECTION_STRING: Host=healthcaresamples-db;Database=clinical;Username=postgres;Password=${DB_PASSWORD:-changeme}
      SCHEDULING_CONNECTION_STRING: Host=healthcaresamples-db;Database=scheduling;Username=postgres;Password=${DB_PASSWORD:-changeme}

networks:
  dbnet:
    name: docker_default
    external: true
