name: clinical
tables:
- name: fhir_patient
  columns:
  - name: Id
    type: Text
  - name: Active
    type: Int
    defaultValue: 1
  - name: GivenName
    type: Text
  - name: FamilyName
    type: Text
  - name: BirthDate
    type: Text
  - name: Gender
    type: Text
    checkConstraint: 'Gender IN (''male'', ''female'', ''other'', ''unknown'')'
  - name: Phone
    type: Text
  - name: Email
    type: Text
  - name: AddressLine
    type: Text
  - name: City
    type: Text
  - name: State
    type: Text
  - name: PostalCode
    type: Text
  - name: Country
    type: Text
  - name: LastUpdated
    type: Text
    defaultValue: CURRENT_TIMESTAMP
  - name: VersionId
    type: Int
    defaultValue: 1
  indexes:
  - name: idx_fhir_patient_family
    columns:
    - FamilyName
  - name: idx_fhir_patient_given
    columns:
    - GivenName
  primaryKey:
    name: PK_fhir_patient
    columns:
    - Id
- name: fhir_encounter
  columns:
  - name: Id
    type: Text
  - name: Status
    type: Text
    checkConstraint: 'Status IN (''planned'', ''arrived'', ''triaged'', ''in-progress'', ''onleave'', ''finished'', ''cancelled'', ''entered-in-error'')'
  - name: Class
    type: Text
    checkConstraint: 'Class IN (''ambulatory'', ''emergency'', ''inpatient'', ''observation'', ''virtual'')'
  - name: PatientId
    type: Text
  - name: PractitionerId
    type: Text
  - name: ServiceType
    type: Text
  - name: ReasonCode
    type: Text
  - name: PeriodStart
    type: Text
  - name: PeriodEnd
    type: Text
  - name: Notes
    type: Text
  - name: LastUpdated
    type: Text
    defaultValue: CURRENT_TIMESTAMP
  - name: VersionId
    type: Int
    defaultValue: 1
  indexes:
  - name: idx_fhir_encounter_patient
    columns:
    - PatientId
  foreignKeys:
  - name: FK_fhir_encounter_PatientId
    columns:
    - PatientId
    referencedTable: fhir_patient
    referencedColumns:
    - Id
  primaryKey:
    name: PK_fhir_encounter
    columns:
    - Id
- name: fhir_condition
  columns:
  - name: Id
    type: Text
  - name: ClinicalStatus
    type: Text
    checkConstraint: 'ClinicalStatus IN (''active'', ''recurrence'', ''relapse'', ''inactive'', ''remission'', ''resolved'')'
  - name: VerificationStatus
    type: Text
    checkConstraint: 'VerificationStatus IN (''unconfirmed'', ''provisional'', ''differential'', ''confirmed'', ''refuted'', ''entered-in-error'')'
  - name: Category
    type: Text
    defaultValue: "'problem-list-item'"
  - name: Severity
    type: Text
    checkConstraint: 'Severity IN (''mild'', ''moderate'', ''severe'')'
  - name: CodeSystem
    type: Text
    defaultValue: "'http://hl7.org/fhir/sid/icd-10-cm'"
  - name: CodeValue
    type: Text
  - name: CodeDisplay
    type: Text
  - name: SubjectReference
    type: Text
  - name: EncounterReference
    type: Text
  - name: OnsetDateTime
    type: Text
  - name: RecordedDate
    type: Text
    defaultValue: CURRENT_DATE
  - name: RecorderReference
    type: Text
  - name: NoteText
    type: Text
  - name: LastUpdated
    type: Text
    defaultValue: CURRENT_TIMESTAMP
  - name: VersionId
    type: Int
    defaultValue: 1
  indexes:
  - name: idx_fhir_condition_patient
    columns:
    - SubjectReference
  foreignKeys:
  - name: FK_fhir_condition_SubjectReference
    columns:
    - SubjectReference
    referencedTable: fhir_patient
    referencedColumns:
    - Id
  primaryKey:
    name: PK_fhir_condition
    columns:
    - Id
- name: fhir_medicationrequest
  columns:
  - name: Id
    type: Text
  - name: Status
    type: Text
    checkConstraint: 'Status IN (''active'', ''on-hold'', ''cancelled'', ''completed'', ''entered-in-error'', ''stopped'', ''draft'')'
  - name: Intent
    type: Text
    checkConstraint: 'Intent IN (''proposal'', ''plan'', ''order'', ''original-order'', ''reflex-order'', ''filler-order'', ''instance-order'', ''option'')'
  - name: PatientId
    type: Text
  - name: PractitionerId
    type: Text
  - name: EncounterId
    type: Text
  - name: MedicationCode
    type: Text
  - name: MedicationDisplay
    type: Text
  - name: DosageInstruction
    type: Text
  - name: Quantity
    type: Double
  - name: Unit
    type: Text
  - name: Refills
    type: Int
    defaultValue: 0
  - name: AuthoredOn
    type: Text
    defaultValue: CURRENT_TIMESTAMP
  - name: LastUpdated
    type: Text
    defaultValue: CURRENT_TIMESTAMP
  - name: VersionId
    type: Int
    defaultValue: 1
  indexes:
  - name: idx_fhir_medication_patient
    columns:
    - PatientId
  foreignKeys:
  - name: FK_fhir_medicationrequest_PatientId
    columns:
    - PatientId
    referencedTable: fhir_patient
    referencedColumns:
    - Id
  - name: FK_fhir_medicationrequest_EncounterId
    columns:
    - EncounterId
    referencedTable: fhir_encounter
    referencedColumns:
    - Id
  primaryKey:
    name: PK_fhir_medicationrequest
    columns:
    - Id
- name: sync_provider
  columns:
  - name: ProviderId
    type: Text
  - name: FirstName
    type: Text
  - name: LastName
    type: Text
  - name: Specialty
    type: Text
  - name: SyncedAt
    type: Text
    defaultValue: CURRENT_TIMESTAMP
  primaryKey:
    name: PK_sync_provider
    columns:
    - ProviderId
